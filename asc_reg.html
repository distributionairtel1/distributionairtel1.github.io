<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASC Registration</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ec1c24;
            --primary-light: #ff4d4d;
            --bg-dark: #0f0f23;
            --bg-card: #1a1a2e;
            --bg-input: #242441;
            --bg-input-hover: #2d2d51;
            --border-color: #2d3748;
            --border-focus: #ec1c24;
            --text-primary: #f7fafc;
            --text-secondary: #a0aec0;
            --text-muted: #718096;
            --success: #38a169;
            --error: #e53e3e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Main Container */
        .container {
            background: var(--bg-card);
            width: 100%;
            max-width: 950px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
        }

        /* Header - PERFECT AS-IS, UNCHANGED */
        .header {
            padding: 40px;
            background: linear-gradient(180deg, rgba(236, 28, 36, 0.1) 0%, transparent 100%);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            position: relative;
        }

        .logo-wrapper {
            display: inline-block;
            margin-bottom: 20px;
            animation: logoFloat 3s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(236, 28, 36, 0.4));
            transition: all 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.1) rotate(5deg);
            filter: drop-shadow(0 0 30px rgba(236, 28, 36, 0.4));
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .header-badge {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 16px;
            background: rgba(236, 28, 36, 0.15);
            border: 1px solid rgba(236, 28, 36, 0.3);
            border-radius: 50px;
            color: var(--primary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(236, 28, 36, 0.3); }
            50% { box-shadow: 0 0 0 10px rgba(236, 28, 36, 0); }
        }

        /* Form Body */
        .form-body {
            padding: 50px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        /* Section Title */
        .section-title {
            grid-column: 1 / -1;
            padding: 20px 0 10px 0;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-icon {
            width: 48px;
            height: 48px;
            background: rgba(236, 28, 36, 0.1);
            border: 2px solid rgba(236, 28, 36, 0.3);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 18px;
        }

        .section-text h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-text p {
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Input Groups */
        .input-group {
            position: relative;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            z-index: 2;
            transition: all 0.3s ease;
        }

        input {
            width: 100%;
            padding: 18px 20px 18px 55px;
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.3px;
        }

        input::placeholder {
            color: var(--text-muted);
        }

        input:hover {
            background: var(--bg-input-hover);
            border-color: rgba(236, 28, 36, 0.3);
        }

        input:focus {
            outline: none;
            background: var(--bg-input-hover);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(236, 28, 36, 0.15);
            transform: translateY(-1px);
        }

        /* File Input */
        .file-input-wrapper {
            position: relative;
            cursor: pointer;
        }

        .file-input-wrapper input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 3;
        }

        .file-input-custom {
            padding: 18px 20px 18px 55px;
            background: var(--bg-input);
            border: 2px dashed var(--border-color);
            border-radius: 14px;
            color: var(--text-muted);
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .file-input-wrapper:hover .file-input-custom {
            border-color: var(--primary);
            background: rgba(236, 28, 36, 0.08);
        }

        .file-input-custom .upload-icon {
            margin-left: auto;
            width: 42px;
            height: 42px;
            background: rgba(236, 28, 36, 0.15);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            transition: all 0.3s ease;
        }

        .file-input-wrapper:hover .upload-icon {
            background: var(--primary);
            color: white;
            transform: scale(1.05);
        }

        /* Validation States */
        .input-group.valid input,
        .input-group.valid .file-input-custom {
            border-color: var(--success);
            background: rgba(56, 161, 105, 0.08);
        }

        .input-group.error input {
            border-color: var(--error);
        }

        /* Submit Button */
        .submit-btn {
            grid-column: 1 / -1;
            margin-top: 30px;
            padding: 20px 40px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 17px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(236, 28, 36, 0.3);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .submit-btn i {
            margin-left: 12px;
            transition: transform 0.3s ease;
        }

        .submit-btn:hover i {
            transform: translateX(6px);
        }

        /* Loading State */
        .submit-btn.loading {
            pointer-events: none;
        }

        .submit-btn.loading .btn-text {
            opacity: 0;
        }

        .submit-btn.loading::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* Footer */
        .footer {
            padding: 30px 50px;
            background: rgba(10, 10, 20, 0.8);
            border-top: 1px solid var(--border-color);
            text-align: center;
        }

        .footer p {
            color: var(--text-muted);
            font-size: 13px;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: var(--primary-light);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .form-body {
                grid-template-columns: 1fr;
                padding: 30px 25px;
                gap: 25px;
            }

            .header {
                padding: 30px 25px;
            }

            .header h1 {
                font-size: 24px;
            }

            .logo {
                width: 60px;
                height: 60px;
            }

            .container {
                margin: 10px;
                border-radius: 16px;
            }
        }

        /* Professional Animations Only */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-group {
            animation: fadeInUp 0.6s ease forwards;
            opacity: 0;
        }

        .input-group:nth-child(1) { animation-delay: 0.1s; }
        .input-group:nth-child(2) { animation-delay: 0.15s; }
        .input-group:nth-child(3) { animation-delay: 0.2s; }
        .input-group:nth-child(4) { animation-delay: 0.25s; }
        .input-group:nth-child(5) { animation-delay: 0.3s; }
        .input-group:nth-child(6) { animation-delay: 0.35s; }
        .input-group:nth-child(7) { animation-delay: 0.4s; }
        .input-group:nth-child(8) { animation-delay: 0.45s; }
        .input-group:nth-child(9) { animation-delay: 0.5s; }
        .input-group:nth-child(10) { animation-delay: 0.55s; }
        .input-group:nth-child(11) { animation-delay: 0.6s; }
        .input-group:nth-child(12) { animation-delay: 0.65s; }
        .input-group:nth-child(13) { animation-delay: 0.7s; }
        .input-group:nth-child(14) { animation-delay: 0.75s; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header - PERFECT AS-IS, UNCHANGED -->
        <div class="header">
            <div class="logo-wrapper">
                <img src="airtel_cropped.png" alt="Airtel Logo" class="logo">
            </div>
            <h1>Airtel Sales Champion Registration</h1>
            <!-- <p>Join the Airtel Partner Network</p> -->
        </div>

        <!-- Form -->
        <form action="/register" method="POST" enctype="multipart/form-data" class="form-body" id="registrationForm">
            
            <!-- Personal Details -->
            <div class="section-title">
                <div class="section-icon">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="section-text">
                    <h3>Personal Details</h3>
                    <p>Enter your personal information accurately</p>
                </div>
            </div>

            <div class="input-group">
                <label for="name">Full Name (as per Aadhaar) *</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>
            </div>

            <div class="input-group">
                <label for="dob">Date of Birth *</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-calendar"></i>
                    <input type="date" id="dob" name="dob" required>
                </div>
            </div>

            <div class="input-group">
                <label for="aadhaar">Aadhaar Card Number *</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="aadhaar" name="aadhaar" placeholder="Enter 12-digit Aadhaar number" maxlength="12" pattern="\d{12}" required>
                </div>
            </div>

            <div class="input-group">
                <label for="aadhaar_img">Upload Aadhaar Card (Front & Back) *</label>
                <div class="input-wrapper file-input-wrapper">
                    <i class="fa-solid fa-image"></i>
                    <input type="file" id="aadhaar_img" name="aadhaar_img" accept="image/*,.pdf" required>
                    <div class="file-input-custom">
                        <span id="file-name">Choose Aadhaar image or PDF</span>
                        <div class="upload-icon">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Professional Details -->
            <div class="section-title">
                <div class="section-icon">
                    <i class="fa-solid fa-briefcase"></i>
                </div>
                <div class="section-text">
                    <h3>Professional Details</h3>
                    <!-- <p>Your Airtel professional information</p> -->
                </div>
            </div>

            <div class="input-group">
                <label for="lapu">LAPU Number *</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-sim-card"></i>
                    <input type="tel" id="lapu" name="lapu" placeholder="Enter LAPU number" required>
                </div>
            </div>

            <div class="input-group">
                <label for="d2d">D2D Number *</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-hashtag"></i>
                    <input type="text" id="d2d" name="d2d" placeholder="Enter D2D number" required>
                </div>
            </div>

            <div class="input-group full-width">
                <label for="doj">Date of Joining (at Airtel) *</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-calendar-check"></i>
                    <input type="date" id="doj" name="doj" required>
                </div>
            </div>

            <!-- Distributor Info -->
            <div class="section-title">
                <div class="section-icon">
                    <i class="fa-solid fa-building"></i>
                </div>
                <div class="section-text">
                    <h3>Distributor & Targets</h3>
                    <!-- <p>Your distributor and performance targets</p> -->
                </div>
            </div>

            <div class="input-group">
                <label for="dist_name">Distributor Name *</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-user-tie"></i>
                    <input type="text" id="dist_name" name="dist_name" placeholder="Enter distributor name" required>
                </div>
            </div>

            <div class="input-group">
                <label for="dist_lapu">Distributor LAPU Number *</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-mobile-screen"></i>
                    <input type="tel" id="dist_lapu" name="dist_lapu" placeholder="Enter distributor LAPU" required>
                </div>
            </div>

            <div class="input-group">
                <label for="mnp_target">MNP Target (Monthly)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-bullseye"></i>
                    <input type="number" id="mnp_target" name="mnp_target" placeholder="e.g. 50" min="0">
                </div>
            </div>

            <div class="input-group">
                <label for="incentive">Targeted Incentive (₹)</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-indian-rupee-sign"></i>
                    <input type="number" id="incentive" name="incentive" placeholder="e.g. 25000" min="0">
                </div>
            </div>

            <button type="submit" class="submit-btn">
                <span class="btn-text">
                    Complete Registration
                    <i class="fa-solid fa-arrow-right"></i>
                </span>
            </button>
        </form>

        <!-- Footer -->
        <div class="footer">
            <p>
                <i class="fa-solid fa-lock"></i> 
                Secured with enterprise-grade encryption | 
                <a href="#">Privacy Policy</a> | 
                <a href="#">Terms of Service</a>
            </p>
        </div>
    </div>

    <script>
        // File input display
        const fileInput = document.getElementById('aadhaar_img');
        const fileName = document.getElementById('file-name');

        fileInput.addEventListener('change', function() {
            if (this.files && this.files[0]) {
                fileName.textContent = this.files[0].name;
                fileName.style.color = 'var(--success)';
                fileInput.closest('.input-group').classList.add('valid');
            }
        });

        // Real-time validation
        const inputs = document.querySelectorAll('input[required]');
        inputs.forEach(input => {
            input.addEventListener('blur', function() {
                const group = this.closest('.input-group');
                if (this.value && this.checkValidity()) {
                    group.classList.add('valid');
                    group.classList.remove('error');
                } else if (this.value) {
                    group.classList.add('error');
                    group.classList.remove('valid');
                }
            });

            input.addEventListener('input', function() {
                const group = this.closest('.input-group');
                if (this.value) {
                    group.classList.remove('error');
                }
            });
        });

        // Form submission
        const form = document.getElementById('registrationForm');
        const submitBtn = document.querySelector('.submit-btn');

        form.addEventListener('submit', function(e) {
            let isValid = true;
            
            // Check all required fields
            const requiredInputs = form.querySelectorAll('input[required]');
            requiredInputs.forEach(input => {
                if (!input.value) {
                    input.closest('.input-group').classList.add('error');
                    isValid = false;
                }
            });

            if (!isValid) {
                e.preventDefault();
                return false;
            }

            submitBtn.classList.add('loading');
            
            // Simulate API call
            setTimeout(() => {
                submitBtn.classList.remove('loading');
                // alert('Registration submitted successfully!');
            }, 2500);
        });

        // Smooth focus scroll
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', function() {
                this.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
        });

        // Aadhaar number formatting
        document.getElementById('aadhaar').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 12) value = value.slice(0, 12);
            e.target.value = value;
        });
    </script>
</body>
</html>
