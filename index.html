<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airtel Registration Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #FFFFFF, #F5F5F5);
    min-height: 100vh;
    overflow-y: auto; /* ✅ FIXED SCROLL */
}

/* Container */
.container {
    padding: 20px 14px;
    max-width: 500px;
    margin: auto;
}

/* Header */
.header {
    text-align: center;
    margin-bottom: 20px;
}

h1 {
    font-size: 1.3rem; /* ✅ smaller */
    color: #E2001A;
}

.subtitle {
    font-size: 0.8rem;
    color: gray;
}

/* List */
ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px; /* ✅ reduced gap */
}

a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px; /* ✅ reduced */
    border-radius: 12px;
    text-decoration: none;
    color: black;
    background: #fff;
    border: 1px solid #eee;
    transition: 0.25s;
}

a:hover {
    border-color: #E2001A;
}

/* Icon */
.icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: #E2001A;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
}

/* Text */
.link-title {
    font-size: 0.9rem;
    font-weight: 600;
}

/* Arrow */
.arrow {
    margin-left: auto;
    font-size: 1rem;
    color: #E2001A;
}

/* Footer */
.footer {
    text-align: center;
    margin-top: 20px;
    font-size: 0.7rem;
    color: gray;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Airtel Registration Portal</h1>
        <p class="subtitle">Select an option to continue</p>
    </div>

    <ul>
        <li>
            <a href="retailer_enroll.html">
                <div class="icon">🏪</div>
                <span class="link-title">Retailer Enrollment</span>
                <div class="arrow">›</div>
            </a>
        </li>

        <li>
            <a href="executive_enroll.html">
                <div class="icon">📋</div>
                <span class="link-title">Lap Scheme / Executive</span>
                <div class="arrow">›</div>
            </a>
        </li>

        <li>
            <a href="test_fire.html">
                <div class="icon">👤</div>
                <span class="link-title">Infra Onboarding Form</span>
                <div class="arrow">›</div>
            </a>
        </li>

        <li>
            <a href="roipdf.html">
                <div class="icon">📈</div>
                <span class="link-title">ROI Dashboard</span>
                <div class="arrow">›</div>
            </a>
        </li>

        <!-- ✅ NEW LINK 1 -->
        <li>
            <a href="af_unified.html">
                <div class="icon">📝</div>
                <span class="link-title">AF Onboarding</span>
                <div class="arrow">›</div>
            </a>
        </li>

            <a href="dist_reg.html">
                <div class="icon">📦</div>

                <div class="arrow">›</div>
            </a>
        </li> -->

    </ul>

    <div class="footer">
        © 2026 Airtel
    </div>

</div>

</body>
</html>
