<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airtel Registration Portal</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    overflow-y: auto; /* ✅ FIXED SCROLL */
}

body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #FFFFFF, #F5F5F5);
}

/* ✅ Animated Logo */
.moving-logo {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 110px;
    height: 110px;
    transform: translate(-50%, -50%);
    z-index: 1000;
    transition: all 1.5s ease;
}

.moving-logo img {
    width: 100%;
    opacity: 0;
    transition: 1s;
}

.moving-logo.reveal img {
    opacity: 1;
}

.moving-logo.settled {
    width: 45px;
    height: 45px;
    top: 20px;
    transform: translateX(-50%);
}

/* Container */
.container {
    padding: 20px 14px;
    max-width: 500px;
    margin: auto;
    margin-top: 45px;
    opacity: 0;
    transition: 0.6s;
}

.container.reveal {
    opacity: 1;
}

/* Header */
.header {
    text-align: center;
    margin-bottom: 20px;
}

h1 {
    font-size: 1.3rem;
    color: #E2001A;
}

.subtitle {
    font-size: 0.8rem;
    color: gray;
}

/* List */
ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    border-radius: 12px;
    text-decoration: none;
    color: black;
    background: #fff;
    border: 1px solid #eee;
    transition: 0.25s;
}

a:hover {
    border-color: #E2001A;
    transform: translateY(-1px);
}

/* Icon */
.icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: #E2001A;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Text */
.link-title {
    font-size: 0.9rem;
    font-weight: 600;
}

/* Arrow */
.arrow {
    margin-left: auto;
    color: #E2001A;
}

/* Footer */
.footer {
    text-align: center;
    margin-top: 20px;
    font-size: 0.7rem;
    color: gray;
}
</style>
</head>

<body>

<!-- ✅ Animated Logo -->
<div class="moving-logo" id="movingLogo">
    <img src="airtel_cropped.png">
</div>

<div class="container" id="mainContainer">

    <div class="header">
        <h1>Airtel Registration Portal</h1>
        <p class="subtitle">Select an option to continue</p>
    </div>

    <ul>
        <li>
            <a href="retailer_enroll.html">
                <div class="icon">🏪</div>
                <span class="link-title">Retailer Enrollment</span>
                <div class="arrow">›</div>
            </a>
        </li>

        <li>
            <a href="executive_enroll.html">
                <div class="icon">📋</div>
                <span class="link-title">Lap Scheme / Executive</span>
                <div class="arrow">›</div>
            </a>
        </li>

        <li>
            <a href="test_fire.html">
                <div class="icon">👤</div>
                <span class="link-title">Promoter Onboarding Form</span>
                <div class="arrow">›</div>
            </a>
        </li>

        <li>
            <a href="roipdf.html">
                <div class="icon">📈</div>
                <span class="link-title">ROI Distributor Dashboard</span>
                <div class="arrow">›</div>
            </a>
        </li>

        <!-- ✅ ADDED -->
        <li>
            <a href="af_unified.html">
                <div class="icon">📝</div>
                <span class="link-title">AF Onboarding</span>
                <div class="arrow">›</div>
            </a>
        </li>

        <!-- ✅ ADDED -->
        <!-- <li>
            <a href="asc_onboard.html">
                <div class="icon">📦</div>
                <span class="link-title">ASC Registration</span>
                <div class="arrow">›</div>
            </a>
        </li> -->

    </ul>

    <div class="footer">
        © 2026 Airtel
    </div>

</div>

<script>
window.addEventListener('load', function() {
    const logo = document.getElementById('movingLogo');
    const container = document.getElementById('mainContainer');

    setTimeout(() => {
        logo.classList.add('reveal');
    }, 200);

    setTimeout(() => {
        logo.classList.add('settled');
        container.classList.add('reveal');
    }, 1500);
});
</script>

</body>
</html>
